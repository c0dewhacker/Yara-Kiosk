<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Do NOT add a Content-Security-Policy meta tag here. The CSP is
         configured in src-tauri/tauri.conf.json and Tauri ships it as a
         response header (production) plus injects per-load nonces. A
         second CSP via meta tag would be enforced alongside the header,
         intersecting to the strictest set — that previously stripped
         'wasm-unsafe-eval' and 'unsafe-inline' silently and broke the
         in-app rule editor (WASM) and report iframe. -->
    <title>YARA-X Kiosk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/input.css" />
  </head>
  <body class="bg-surface-900 text-white font-sans h-full overflow-hidden">
    <div id="app" class="h-full"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
