name: Release

# Opens/updates a Release PR on every conventional commit to master.
# Merging the Release PR creates the GitHub Release, then builds and attaches
# Linux AppImage, Linux .deb, and Windows x86_64 .exe — all in one workflow.
# workflow_dispatch lets you re-run the build jobs against an existing tag.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to rebuild artifacts for (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  # ── Stage 1: Release Please ───────────────────────────────────────────────
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created }}
      tag_name:        ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || steps.rp.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Stage 2a: Linux — AppImage + .deb ────────────────────────────────────
  build-linux:
    name: Build — Linux (AppImage + .deb)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libpam0g-dev \
            libclang-dev \
            clang

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage + .deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles appimage,deb

      - name: Upload artifacts with friendly names
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          SEM="${TAG#v}"
          for f in target/release/bundle/appimage/*.AppImage; do
            cp "$f" "YaraKiosk-${SEM}.AppImage"
            gh release upload "$TAG" "YaraKiosk-${SEM}.AppImage" --clobber
          done
          for f in target/release/bundle/deb/*.deb; do
            cp "$f" "YaraKiosk-${SEM}.deb"
            gh release upload "$TAG" "YaraKiosk-${SEM}.deb" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 2b: Windows x86_64 — .exe installer ────────────────────────────
  build-windows:
    name: Build — Windows x86_64 (.exe)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows .exe installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis

      - name: Upload artifact with friendly name
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          SEM="${TAG#v}"
          for f in target/release/bundle/nsis/*.exe; do
            cp "$f" "YaraKiosk-${SEM}.exe"
            gh release upload "$TAG" "YaraKiosk-${SEM}.exe" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
