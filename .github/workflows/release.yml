name: Release

# Opens/updates a Release PR on every conventional commit to master.
# Merging the Release PR creates the GitHub Release, then builds and attaches
# both the Linux AppImage and Windows installer — all in one workflow.
# workflow_dispatch lets you re-run the build jobs against an existing tag.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to rebuild artifacts for (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  # ── Stage 1: Release Please ───────────────────────────────────────────────
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ github.event_name == 'workflow_dispatch' || steps.rp.outputs.release_created }}
      release_id:      ${{ steps.rp.outputs.id }}
      tag_name:        ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || steps.rp.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Stage 2a: Linux AppImage ──────────────────────────────────────────────
  build-linux:
    name: Build — Linux AppImage
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}

      - name: Resolve release ID
        id: release-id
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.tag_name }}" --jq '.id')
          else
            id="${{ needs.release-please.outputs.release_id }}"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libpam0g-dev \
            libclang-dev \
            clang

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach AppImage to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.release-id.outputs.id }}

  # ── Stage 2b: Windows NSIS installer ─────────────────────────────────────
  build-windows:
    name: Build — Windows installer
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}

      - name: Resolve release ID
        id: release-id
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.tag_name }}" --jq '.id')
          else
            id="${{ needs.release-please.outputs.release_id }}"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach installer to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.release-id.outputs.id }}
